<?xml version="1.0" encoding="UTF-8"?>
<!-- A comic page drawn with every element and attribute kind the profile allows. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Page one</title>
  <desc>A harbor at dawn, drawn as a placeholder.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox" spreadMethod="pad">
      <stop offset="0" stop-color="#32BCE9" stop-opacity="1"/>
      <stop offset="100%" stop-color="rgb(252, 252, 250)"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%" gradientTransform="translate(10 20) scale(1.5)">
      <stop offset="0.2" stop-color="gold"/>
      <stop offset="1" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="frame" clipPathUnits="userSpaceOnUse">
      <rect x="10" y="10" width="780" height="1180" rx="4"/>
    </clipPath>
    <mask id="fade" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="800" height="1200">
      <rect width="800" height="1200" fill="white" opacity="0.8"/>
    </mask>
  </defs>
  <g clip-path="url(#frame)" mask="url('#fade')" transform="rotate(0 400 600)">
    <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
    <circle cx="600" cy="200" r="80" fill="url(#sun) #F5EE2F" stroke="none"/>
    <ellipse cx="400" cy="900" rx="300" ry="40" fill="#1d1d1a" fill-opacity="0.5"/>
    <path d="M10 700 L790 700 L790 1190 L10 1190 Z m 5 5 h10 v10 c1,2 3,4 5,6 s1 2 3 4 q1 1 2 2 t3 3 a10 10 0 0 1 20 20 z" fill="none" stroke="#050708" stroke-width="2" stroke-linecap="round" stroke-linejoin="bevel" stroke-miterlimit="4" stroke-dasharray="4 2" stroke-dashoffset="1" fill-rule="evenodd" clip-rule="nonzero"/>
    <line x1="0" y1="600" x2="800" y2="600" stroke="currentColor" stroke-opacity="50%"/>
    <polyline points="0,0 10,10 20,0" fill="none" stroke="red"/>
    <polygon points="100 100 150 150 100 150" fill="hsl(200, 50%, 50%)"/>
    <text x="40" y="1100" dx="0 1 2" dy="0" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="32" font-weight="600" text-anchor="start" dominant-baseline="alphabetic">Narration: <tspan font-weight="bold">late again</tspan>.</text>
  </g>
</svg>
