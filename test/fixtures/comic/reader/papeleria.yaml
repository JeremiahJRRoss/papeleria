# M4.2, M4.3 (W4): the comic reader's fixture. Five pages, every detail kind,
# a page with no panels, SVG and raster pages. The raster pages and the extra
# image are made when the tests run (test/fixtures/comic/generate.ts): 01, 02
# and 04 as PNG, the detail image as PNG; 03 and 05 are the SVGs committed here.
schema: 1
template: comic
title: The <b>reader</b> & "fixture"
language: en
status: review
wordmark: fixture
credits:
  - { role: Art, name: "Generated by the tests" }
  - { role: Words, name: "A. Writer & co" }
pages:
  - image: assets/images/pages/01.png
    alt: Page one, five panels, one of each kind.
    credit: Generated by the tests
    rights: Test fixture; no rights claimed
    panels:
      - box: [4, 4, 56, 28]
        transcript: "Panel one zooms into the art."
        detail: { zoom: true }
      - box: [64, 4, 32, 28]
        transcript: "Panel two opens a note."
        detail: { text: assets/text/note.md }
      - box: [4, 36, 92, 26]
        transcript: "Panel three has no detail; its transcript is announced."
      - box: [4, 66, 44, 30]
        transcript: "Panel four links to page four."
        detail: { href: "#page-4", label: Go to page four }
      - box: [52, 66, 44, 30]
        transcript: "Panel five links out."
        detail: { href: "https://example.com/more", label: More on the web }
  - image: assets/images/pages/02.png
    alt: Page two, an extra picture and an escaped transcript.
    credit: Generated by the tests
    rights: Test fixture; no rights claimed
    panels:
      - box: [0, 0, 100, 50]
        transcript: "Panel one of page two shows another picture."
        detail:
          image:
            src: assets/images/extra.png
            alt: An extra picture, wider than tall.
            caption: The extra picture's caption.
            credit: Generated by the tests
            rights: Test fixture; no rights claimed
      - box: [0, 50, 100, 50]
        transcript: 'Speech: <b>not bold</b> & "quoted"'
  - image: assets/images/pages/03.svg
    alt: Page three has no panels at all.
    credit: Drawn for the tests
    rights: Test fixture; no rights claimed
  - image: assets/images/pages/04.png
    alt: Page four, one large panel.
    credit: Generated by the tests
    rights: Test fixture; no rights claimed
    panels:
      - box: [10, 10, 80, 80]
        transcript: "Page four's only panel, where panel four's link lands."
        detail: { zoom: true }
  - image: assets/images/pages/05.svg
    alt: Page five, a drawn page whose panel zooms into its own file.
    credit: Drawn for the tests
    rights: Test fixture; no rights claimed
    panels:
      - box: [25, 25, 50, 50]
        transcript: "The last panel zooms into the SVG."
        detail: { zoom: true }
      - box: [0, 80, 100, 20]
        transcript: "The last panel of all, at the exact edge."
